<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070a">
<title>VIT Map — Vellore campus</title>
<meta name="description" content="VIT Vellore campus map: SJT, PRP classrooms, hostels, gates, mess menus, and one fast search.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./logo.svg">
</head>
<body>
  <header id="bar">
    <button id="brand-btn" type="button" title="About &amp; data sources">
      <img class="mark" src="./logo.svg" width="28" height="28" alt="">
      <span class="word">VIT</span>
      <span class="place">Vellore</span>
    </button>

    <!-- View Mode Switcher: Overview, Map, or Dashboard -->
    <div id="view-mode-toggle" class="view-mode-group" role="group" aria-label="Application View Mode">
      <button id="view-landing-btn" class="view-btn" type="button" data-view="landing" title="Sentinel Project Overview &amp; Features">
        <svg class="view-btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="12 8 8 12 12 16 12 8"/><line x1="16" y1="12" x2="12" y2="12"/></svg>
        <span class="view-btn-label">Overview</span>
      </button>
      <button id="view-map-btn" class="view-btn active" type="button" data-view="map" title="Interactive Campus Map">
        <svg class="view-btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
        <span class="view-btn-label">Map View</span>
      </button>
      <button id="view-dash-btn" class="view-btn" type="button" data-view="dashboard" title="Campus Safety Dashboard">
        <svg class="view-btn-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span class="view-btn-label">Dashboard</span>
      </button>
    </div>

    <button id="open-search" type="button" aria-label="Search campus">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M10.5 10.5 L14.2 14.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span class="ph">SJT, PRP 327, Gate 11, mess…</span>
      <kbd>⌘K</kbd>
    </button>
    <div id="jump" role="group" aria-label="Jump to">
      <button id="go-mess" type="button" title="Jump to campus messes">Mess</button>
      <button id="go-prp" type="button" title="Jump to PRP classrooms">PRP</button>
    </div>
    <button id="layers-btn" type="button" aria-expanded="false" aria-controls="layers">
      <span class="dots" aria-hidden="true"></span>
      <span class="lbl">Layers</span>
      <span class="n"></span>
    </button>
    <button id="disaster-btn" class="hazard-normal" type="button" aria-expanded="false" title="Campus Hazards &amp; Safety (Normal Conditions)">
      <svg class="disaster-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span class="lbl">Hazards</span>
      <span class="disaster-badge badge-normal" id="disaster-count-badge">0</span>
    </button>

    <div id="basemap" role="group" aria-label="Basemap">
      <button id="map-btn" type="button" aria-pressed="false">Map</button>
      <button id="sat-btn" type="button" aria-pressed="true">Satellite</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="view3d-btn" type="button" aria-pressed="false" title="Tilt into 3D (right-drag or two fingers to rotate)">3D</button>
    </div>
  </header>

  <!-- Main Application Workspace -->
  <div id="app-workspace" class="view-mode-map">
    <!-- Sentinel Landing Page & Platform Overview -->
    <section id="landing-viewport" class="landing-viewport" aria-label="Sentinel Project Overview &amp; Landing Page"></section>

    <!-- Primary Operations Dashboard -->
    <main id="primary-dashboard" aria-label="Sentinel Operations Dashboard"></main>

    <!-- Map Viewport -->
    <div id="map-viewport" aria-label="Campus Map Viewport">
      <div id="map" aria-label="Campus map"></div>

      <button id="locate-btn" type="button" aria-pressed="false" aria-label="Show my location" title="Show my location">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <circle cx="10" cy="10" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M10 2.2v2.4M10 15.4v2.4M2.2 10h2.4M15.4 10h2.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>

      <div id="dock">
        <footer id="foot">
          <a href="https://www.openstreetmap.org/relation/15931944" target="_blank" rel="noopener">
            <span>VIT Vellore</span>
          </a>
        </footer>
      </div>

      <div id="attrib">
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
        <span> · </span>
        <a href="https://www.esri.com" target="_blank" rel="noopener">Tiles © Esri</a>
      </div>
    </div>
  </div>

  <nav id="layers" aria-label="Map layers">
    <div class="layers-head">
      <span class="t">Layers</span>
      <button type="button" data-all>All</button>
      <button type="button" data-none>None</button>
      <button type="button" class="layers-close" aria-label="Close layers">&times;</button>
    </div>
    <div id="layer-chips"></div>
  </nav>

  <section id="panel" hidden aria-live="polite"></section>


  <div id="palette" hidden role="dialog" aria-modal="true" aria-label="Search campus">
    <div id="palette-box">
      <div id="palette-input-row">
        <span id="palette-glyph" aria-hidden="true">›</span>
        <input id="palette-input" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" enterkeyhint="go"
               placeholder="prp 327 · gate 11 · sjt · mess dinner · mh k"
               aria-label="Search campus" aria-controls="palette-results" aria-expanded="true">
        <span id="palette-timing" aria-hidden="true"></span>
        <button id="palette-close" type="button" aria-label="Close search">&times;</button>
      </div>
      <div id="palette-results" role="listbox"></div>
      <footer id="palette-foot">
        <span class="hint"><kbd>↑↓</kbd> move</span>
        <span class="hint"><kbd>↵</kbd> open</span>
        <span class="hint"><kbd>tab</kbd> route</span>
        <a id="palette-repo" href="https://www.openstreetmap.org/relation/15931944" target="_blank" rel="noopener">edit OSM</a>
        <span id="palette-count"></span>
      </footer>
    </div>
  </div>

  <div id="boot">finding your way around VIT…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
